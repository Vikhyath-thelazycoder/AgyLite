# Agylite — upstream tracking policy (P28, D-047)
#
# `agylite update --check` asks each upstream for its newest commit (git ls-remote, seconds, nothing downloaded).
# `agylite update --latest --due` applies the upstreams whose interval has passed: only new commits are fetched into a
# local blobless mirror, then each goes through the checked pipeline (inventory diff, dangling-reference check, rules,
# closure, MCP/hook checks, integrity, registry, optional runtime self-tests) and `current` switches only if all pass.
#
# track:  weekly | monthly | manual (never automatic) | releases (newest version tag instead of the branch head)
# branch: the branch followed when track is weekly/monthly
# self_test: also run the runtime's self-tests before switching (upstreams that ship running code)

version: 1
default: {track: weekly}

upstreams:
  ecc:        {track: weekly, branch: main}
  addy:       {track: weekly, branch: main}
  agency:     {track: weekly, branch: main}
  gstack:     {track: weekly, branch: main}
  karpathy:   {track: monthly, branch: main}
  unlazy:     {track: weekly, branch: main, self_test: true}
  ponytail:   {track: monthly, branch: main}
  graphify:   {track: monthly, branch: v8, self_test: true}
  opendesign: {track: weekly, branch: main}
  taste:      {track: weekly, branch: main, self_test: true}   # MP4 §1.6: v2.1 layout migrated
  uiuxpromax: {track: weekly, branch: main, self_test: true}
  brag:       {track: monthly, branch: main}
  beacon:     {track: monthly, branch: main}
  beyondseo:  {track: weekly, branch: main}
  appllama:   {track: monthly, branch: main}
  pocock:     {track: weekly, branch: main}
