# engineering/security — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Security
description: Security review and audit (guidance or full audit), variant hunting, footgun review, guardrails
intent_tags: [security, security review, security audit, pentest, auth, authentication, authorization, csrf, xss, injection, secret, webhook verification, vulnerability, owasp]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: true
context_level: L2
priority: 90
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [threats addressed are listed with evidence, testing/security checks pass, 'no secrets in code, config or logs']
dependencies: []
related_capabilities: [testing/security, codebase/impact-analysis]
conflicts: []
fallback_capability: null
enabled: true
# Step 4 (doc 23 §3): Cloudflare owns review/audit. gstack cso, ECC security-review/safety-guard, Addy security-auditor and
# three Agency roles stay bundled (`agylite skill load` by name) but never lead a route: config/priorities.yaml route_excluded.
sources_priority: [files/cfsecurity/skills/security-audit/SKILL.md, files/tob/plugins/variant-analysis/skills/variant-analysis/SKILL.md, files/tob/plugins/sharp-edges/skills/sharp-edges/SKILL.md]
