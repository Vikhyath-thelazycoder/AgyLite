# Agylite — context budgets (P9, spec §16, §47, D-014)
#
# Token figures are ESTIMATES: bytes ÷ 4 (spec §46; no model tokenizer is used). Every value is a configurable
# starting point from the doc 13 measurements; P25 benchmarks them against representative prompts and may change them
# ("do not make arbitrary limits without testing", spec §47). Each limit states why it exists.

version: 1
estimate: bytes/4

levels:
  L0:
    max_tokens: 1500
    why: >-
      Bootstrap runs on every task. OS identity, host, project/session ids, phase, compact state, plan pointer, the
      capability index and the Ponytail lite ruleset (MP3 §2.2, ≈ 700 tokens, never truncated); 1,500 still leaves room
      for a few state lines without letting state dumps creep into every turn.
  L1:
    max_tokens_per_domain: 2000
    why: >-
      A rendered CARD.md is ≤ 250 est. tokens (registry check enforces ≤ 1,000 bytes); 2,000 per domain fits the
      routed cards of one domain (P7 finding: whole domains exceed this, so only routed cards are loaded).
  L2:
    primary_skill: whole
    max_whole_skills_per_task: 2
    max_tokens_per_task: 40000
    why: >-
      IMPLEMENTATION_PLAN §2.1 (Plan B, owner decision 2026-10-21): the upstreams benchmarked their complete skill, so a
      routed capability's primary SKILL.md loads whole, never section-picked or truncated; its references are listed
      and read on demand, as the original skill says. One whole skill per task, two when the route has strong signals in
      two domains; other routed capabilities are index only. 40,000 lets the largest primaries (gstack ship and
      investigate, 12–20K tokens) fit whole next to a second skill. Section-level loading remains for L3 only.
  L3:
    max_tokens_per_fetch: 12000
    explicit_only: true
    why: >-
      Deep references (playbooks, design systems, large docs) are never loaded by default (spec §16 "never default to
      Level 3"); one explicit fetch is capped so a single reference cannot flood the context.

# Spec §47 limits that other components enforce, kept here so all budgets are documented in one place.
reference_depth:
  value: 1
  why: An L3 fetch may follow links one hop from the L2 file that cited them; deeper chains need another request.
code_files_per_task:
  value: 12
  why: Graphify affected/query results narrow the code surface first (spec §23); full-repo dumps are forbidden. Enforced in P12.
project_doc_sections_per_turn:
  value: 2
  why: State + plan index are read every turn; at most two full project-doc sections join them (spec §48–49). Enforced in P10.
semantic_results:
  value: 3
  why: BM25 fallback results per request; mirrors config/routing.yaml limits.bm25_top_k (the router reads that value).

# MP1 F15 (D-048): the UserPromptSubmit hook injects the route, the load command and the routed L1 cards.
prompt_hook:
  max_tokens: 800
  primary_skill_max_tokens: 12000
  why: >-
    Pilot 2026-10-21 (AUDIT_REPORT §9): the agent made 0 agylite calls on small, clear tasks, so the SessionStart
    suggestion alone left AgyLite equal to no skill. The owner decided to auto-route every prompt; 800 fits the route
    line, the load command and two or three cards, and cards already sent this session become one-line markers.
    primary_skill_max_tokens (MP3/MP4 Tier 1, owner 2026-10-22): the agent still ran `agylite skill load` in 0 of 37
    MP3 sessions and 2 of 3 design sessions, so the first whole skill now rides in the hook, never truncated, once per
    session (later prompts get a marker). 12,000 fits the design and engineering primaries (Taste ≈ 9,700); larger
    skills (gstack ship, investigate) stay a load command.
