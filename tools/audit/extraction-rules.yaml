# Agylite v2 — upstream extraction rules (P2 draft; consumed by tools/audit/extraction_matrix.py, later by the P6 bundler)
#
# Every tracked upstream file receives exactly one decision: the FIRST rule whose glob matches wins,
# otherwise the repo default applies. Globs: fnmatch with `**` = any depth.
# Decisions (spec §38): COPY (verbatim), ADAPT (rewritten into domain form), WRAP (invoked through an OS wrapper),
# REFERENCE (stays in staging; design input only, never bundled), PRESERVE (intact subsystem), EXCLUDE.
# D-005 selective real extraction · D-006 dependency closure · D-002 licenses never block (but LICENSE/NOTICE are carried).

version: 1

reason_codes:
  MCP: "MCP server/config/client (spec §2.1)"
  ALWAYS_ON: "Always-on hook, daemon or background process (spec §2.5)"
  TELEMETRY: "Telemetry, analytics or remote egress (spec §44)"
  INSTALLER: "Upstream installer/updater mutating host config (OS install flow owns this, §34)"
  HOST_PORT: "Per-host copy of canonical content (adapters render host forms, §2.2)"
  TRANSLATION: "Translated duplicate of canonical English content"
  OUT_OF_DOMAIN: "No Agylite domain needs it"
  PRODUCT_RUNTIME: "Upstream product app/daemon/cloud, not a capability"
  DUPLICATE: "Byte-identical or equivalent copy of a canonical file elsewhere"
  SUPERSEDED: "Replaced by a better source or by an OS-native mechanism"
  REPO_META: "Repository plumbing (CI, issue templates, badges, release tooling)"
  DOC_ASSET: "README/docs imagery or marketing material"
  UPSTREAM_DEV: "Upstream build/dev/test tooling for excluded code"
  GENERATED: "Generated artifact; bundle the source instead"
  PAID_API: "Requires a paid third-party generation API"
  HOST_SPECIFIC_TOOL: "Requires a proprietary tool not available to the OS (e.g. Figma, Aside)"
  LICENSE: "License/notice file (carried verbatim with bundled content, D-002)"
  UNAUDITED_DEPENDENCY: "Requires an external package outside the audited upstream set (spec §43)"
  BROWSER_POLICY: "Browser/Chrome DevTools/screenshot/simulator-recording verification; disabled by the local test-first policy (D-035, config/verification.yaml)"
  PAID_SERVICE: "Requires a paid account, credits or a remote proprietary service (D-034)"

repos:

  # ------------------------------------------------------------------ ENGINEERING SOURCES
  karpathy:
    default: {decision: EXCLUDE, reason: HOST_PORT}
    rules:
      - {paths: ["skills/karpathy-guidelines/SKILL.md"], decision: COPY, capability: engineering/principles, reason: "Four engineering principles"}
      - {paths: ["EXAMPLES.md"], decision: COPY, capability: engineering/principles, reason: "Worked examples (Level 3)"}
      - {paths: ["README.md"], decision: REFERENCE, reason: "Attribution source; MIT declared without LICENSE text (L-1)"}

  unlazy:
    default: {decision: PRESERVE, capability: engineering/completion, reason: "Executable completion discipline; SKILL.md references templates/, references/, scripts/ (closure)"}
    rules:
      - {paths: ["LICENSE"], decision: COPY, capability: engineering/completion, reason: LICENSE}
      - {paths: [".github/**", ".gitignore", "CONTRIBUTING.md", "CHANGELOG.md"], decision: EXCLUDE, reason: REPO_META}
      - {paths: ["research/**"], decision: PRESERVE, capability: engineering/completion, reason: "Validation protocol linked from references/method.md and token-economy.md (closure)"}
      - {paths: ["agents/openai.yaml"], decision: REFERENCE, reason: "Codex interface hint; adapter renders its own"}
      - {paths: ["scripts/install-hooks.mjs"], decision: PRESERVE, capability: engineering/completion, reason: "INERT: required by upstream self-check tests; never invoked by the OS; adapted SKILL.md omits it (§2.3)"}
      - {paths: ["SKILL.md"], decision: ADAPT, capability: engineering/completion, reason: "Hook-install step rewritten to OS central Stop-hook registration (§2.3)"}
      - {paths: ["README.md"], decision: EXCLUDE, reason: REPO_META}

  ponytail:
    default: {decision: EXCLUDE, reason: HOST_PORT}
    rules:
      - {paths: ["LICENSE"], decision: COPY, capability: engineering/simplicity, reason: LICENSE}
      - {paths: ["skills/ponytail/SKILL.md", "skills/ponytail-review/SKILL.md", "skills/ponytail-audit/SKILL.md", "skills/ponytail-debt/SKILL.md", "skills/ponytail-gain/SKILL.md"], decision: ADAPT, capability: engineering/simplicity, reason: "Simplicity/YAGNI discipline; loaded only via routing (never via hooks)"}
      - {paths: ["skills/ponytail-help/SKILL.md"], decision: EXCLUDE, reason: SUPERSEDED}
      - {paths: ["examples/**"], decision: COPY, capability: engineering/simplicity, reason: "Worked examples (Level 3)"}
      - {paths: ["hooks/ponytail-instructions.js"], decision: REFERENCE, reason: "Ruleset text source for lite/full/ultra levels"}
      - {paths: ["hooks/**", "scripts/**", "plugin.json", "plugin.yaml", "package.json", "opencode.json", "gemini-extension.json", "__init__.py"], decision: EXCLUDE, reason: ALWAYS_ON}
      - {paths: ["ponytail-mcp/**"], decision: EXCLUDE, reason: MCP}
      - {paths: ["benchmarks/**"], decision: REFERENCE, reason: "Benchmark methodology for P25 (calls remote LLMs; never bundled)"}
      - {paths: ["tests/**", "pi-extension/**"], decision: EXCLUDE, reason: UPSTREAM_DEV}

