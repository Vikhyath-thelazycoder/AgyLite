# Agylite — always-on discipline switches (MP1 F15; MP3 adds the Ponytail ruleset level here).

version: 1

# Ponytail ruleset in L0 (MP3 §2.2, owner decision 2026-10-21): the generated lite rules (files/ponytail/RULESET-lite.md)
# are always on. `off` removes them. `full`/`ultra` are not offered until MP2 measures them.
ponytail_ruleset: lite

# UserPromptSubmit hook (D-048): route every prompt and inject the route with it. `off` disables injection.
prompt_hook: on

# Prompts that carry no new task: the earlier route still applies, so nothing is injected.
prompt_hook_followups:
  max_words: 3
  phrases: ["yes", "no", "ok", "okay", "continue", "go on", "do it", "thanks", "thank you"]
