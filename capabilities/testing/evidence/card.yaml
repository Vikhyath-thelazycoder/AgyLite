# testing/evidence — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Evidence
description: Machine-readable verification evidence (command, suite, counts, result, artifact hash) written to the project's verification state
intent_tags: [evidence, test results, verification evidence]
origin: os-native
runtime_type: os-native
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L1
security_class: local-exec
cache_strategy: none
activation_conditions:
  mode: internal
  when: [reached through dependencies of verification capabilities]
verification_requirements: ['every record states command, exit code and counts', '"looks correct" or a screenshot alone is never evidence']
dependencies: []
related_capabilities: [testing/local-verification, testing/release-verification]
conflicts: []
fallback_capability: null
web_qa_class: CORE
enabled: true
