# Agylite — Priority Configuration
# Conflict resolution and domain-level defaults. Per-capability metadata lives in capabilities/**/card.yaml.

# When two capabilities provide conflicting guidance, use this hierarchy (level 1 wins)
conflict_hierarchy:
  - level: 1
    source: user-requirements
    description: "Explicit user requirements always win"

  - level: 2
    source: project-security
    description: "Security and safety constraints"

  - level: 3
    source: project-architecture
    description: "Established project architecture decisions"

  - level: 4
    source: engineering-methodology
    description: "Engineering workflow methodology (planning, implementation, testing, verification)"

  - level: 5
    source: security-testing
    description: "Specialized security and testing guidance"

  - level: 6
    source: domain-specialists
    description: "Domain specialist perspectives"

  - level: 7
    source: product-review
    description: "Product and release review workflows"

  - level: 8
    source: simplicity
    description: "Simplicity optimization (explicit request only)"

# Domain-level defaults. A card's `priority` (1–100, higher wins ties within a hierarchy level) and
# `activation_conditions.mode` fall back to these when the card does not set them.
# Activation modes: on-demand (routed by intent) · explicit (only on explicit user request) ·
# stack-detected (selected by project stack) · internal (used by the OS or other capabilities, never routed directly) ·
# fallback (only when deterministic capabilities cannot decide).
domain_defaults:
  engineering: {priority: 50, activation: on-demand}
  codebase: {priority: 50, activation: on-demand}
  design: {priority: 50, activation: on-demand}
  testing: {priority: 50, activation: on-demand}
  research: {priority: 50, activation: on-demand}
  youtube: {priority: 50, activation: on-demand}
  seo: {priority: 50, activation: on-demand}
  media: {priority: 50, activation: on-demand}
  observability: {priority: 50, activation: internal}

# Overlapping skills (owner decision 2026-10-22, option 2; D-050): when one job has a skill in more than one upstream,
# both load whole — `lead` first and named as the one that wins a disagreement, `also` next to it — instead of one
# primary per capability, which left Addy's own suite equal to no skill. Either side may be the routed primary; the
# pair loads the same way. The partner rides along only while the hook stays within `prompt_hook.max_chars`. Paths are bundle paths, checked
# against the bundle by `agylite validate`.
skill_overlaps:
  - {lead: files/pocock/skills/engineering/tdd/SKILL.md, also: files/addy/skills/test-driven-development/SKILL.md}
  - {lead: files/pocock/skills/engineering/diagnosing-bugs/SKILL.md, also: files/addy/skills/debugging-and-error-recovery/SKILL.md}
  - {lead: files/ponytail/skills/ponytail-review/SKILL.md, also: files/addy/skills/code-review-and-quality/SKILL.md}
  - {lead: files/pocock/skills/engineering/to-spec/SKILL.md, also: files/addy/skills/spec-driven-development/SKILL.md}
  - {lead: files/pocock/skills/engineering/to-tickets/SKILL.md, also: files/addy/skills/planning-and-task-breakdown/SKILL.md}
  - {lead: files/pocock/skills/productivity/grilling/SKILL.md, also: files/addy/skills/interview-me/SKILL.md}
  - {lead: files/ponytail/skills/ponytail/SKILL.md, also: files/addy/skills/code-simplification/SKILL.md}
  # Step 4 (doc 23 §2): one job each, loaded together only on landing pages (the landing-conversion rule): Taste leads on
  # look and structure, Elaya's Part A on what the page says. `rules:` limits a pair to routes where one of them matched.
  - {lead: files/taste/skills/taste-skill/SKILL.md, also: files/elaya/skills/landing-page-design/SKILL.md, rules: [landing-conversion]}

# Step 4 (doc 23 §3, one owner per job): bundled skills that duplicate an owner's job. They stay searchable
# (`agylite skills search`) and loadable by name (`agylite skill load`), but no route leads with them: `agylite validate`
# fails when one appears in a card's sources_priority, a routing rule's `skill` or a `skill_overlaps` pair.
route_excluded:
  - files/gstack/cso/SKILL.md                                   # security audit → Cloudflare security-audit
  - files/gstack/cso/sections/audit-phases.md
  - files/ecc/skills/security-review/SKILL.md                   # security review → Cloudflare security-audit
  - files/ecc/skills/security-review/cloud-infrastructure-security.md
  - files/ecc/agents/security-reviewer.md
  - files/addy/agents/security-auditor.md
  - files/agency/security/security-appsec-engineer.md
  - files/agency/security/security-penetration-tester.md
  - files/agency/security/security-ai-generated-code-auditor.md
  - files/ecc/skills/safety-guard/SKILL.md                      # guardrails → gstack careful / freeze / guard
