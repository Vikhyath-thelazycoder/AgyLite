# seo/strategy — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Strategy
description: 30/60/90-day plans, growth models, roadmaps
intent_tags: [seo plan, 90-day, seo roadmap, content roadmap, strategy]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [actions tied to evidence and measurable targets, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: []
related_capabilities: [seo/auditing]
conflicts: []
fallback_capability: null
enabled: true
