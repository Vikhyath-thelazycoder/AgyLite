# design/accessibility — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Accessibility
description: Accessible design baseline and checklist
intent_tags: [accessibility, a11y, wcag, screen reader, keyboard]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['each WCAG 2.2 AA checklist item is marked pass, fail or not applicable', 'automated check run via testing/accessibility']
dependencies: []
related_capabilities: [testing/accessibility]
conflicts: []
fallback_capability: null
enabled: true
