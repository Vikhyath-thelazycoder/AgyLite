# Routing scenarios from the master spec (P8 acceptance). `expect` must appear in capabilities ∪ dependencies;
# `forbid` entries are capability ids or domain prefixes ("seo/") that must not appear at all (an expected id inside a
# forbidden domain is allowed). Spec §70 scenario I (multiple projects) is an isolation scenario: tests/isolation (P11).

# The spec names some capabilities that the registry implements under a domain-first id (D-028, doc 06).
aliases:
  testing/integration: testing/local-verification
  testing/responsive: testing/local-verification
  seo/aeo: seo/ai-search
  seo/geo: seo/ai-search
  security baseline: engineering/security
  native crawler: seo/runtime
  runtime/SEO crawler: seo/runtime

scenarios:
  # ── Spec §14 ──────────────────────────────────────────────────────────────────────────────────────────────────
  - id: s14-checkout-security
    request: Improve checkout security.
    stage: existing
    expect: [engineering/security, codebase/impact-analysis, testing/security, engineering/completion]
    forbid: [design/, seo/, media/, engineering/simplicity]
    change_type: SECURITY_CHANGE

  - id: s14-landing-premium
    request: Make the landing page feel premium.
    stage: unknown
    expect: [design/design-direction, design/visual-quality, design/typography, design/frontend, design/design-review]
    forbid: [seo/, media/, engineering/, codebase/, design/inspiration-extract]
    change_type: DESIGN_CHANGE

  - id: s14-seo-audit
    request: Audit my website's SEO.
    stage: unknown
    expect: [seo/auditing, seo/technical, seo/content, seo/evidence, seo/reporting, runtime/SEO crawler]
    forbid: [engineering/, design/, media/, testing/browser-exception]
    change_type: SEO_CHANGE

  - id: s14-ai-search
    request: Make my website rank better in AI search.
    stage: unknown
    expect: [seo/aeo, seo/geo, seo/entity, seo/content, seo/evidence]
    forbid: [engineering/, media/, design/]
    change_type: SEO_CHANGE

  - id: s14-build-saas
    request: Build a SaaS application.
    stage: new
    expect: [engineering/planning, engineering/architecture, design/design-direction, security baseline, testing/strategy]
    forbid: [codebase/, seo/, media/]

  # ── Spec §23A.14 web QA, under the local test-first policy (D-035): browser is never selected ────────────────
  - id: s23a-login-flow
    request: Check whether the login flow works.
    stage: existing
    expect: [testing/integration, testing/security, testing/evidence]
    forbid: [testing/browser-exception, seo/, media/]
    browser: disabled

  - id: s23a-mobile-overlap
    request: Check whether the mobile header overlaps the hero.
    stage: existing
    expect: [design/visual-quality, testing/responsive, design/frontend]
    forbid: [testing/browser-exception, seo/, media/]
    browser: disabled

  - id: s23a-explicit-visual
    request: Open the website and show me what it looks like.
    stage: existing
    expect: [testing/local-verification]
    forbid: [testing/browser-exception, seo/, media/, engineering/]
    browser: exception-requested

  - id: s23a-technical-seo
    request: Audit the site's technical SEO.
    stage: unknown
    expect: [seo/auditing, seo/technical, seo/evidence]
    forbid: [testing/, engineering/]
    browser: disabled

  # ── Verification-policy routing examples (D-034, D-035) ───────────────────────────────────────────────────────
  - id: vp-payment-webhook
    request: Fix the payment webhook.
    stage: existing
    expect: [engineering/backend, engineering/security, codebase/impact-analysis, testing/local-verification, testing/security, testing/evidence]
    forbid: [testing/browser-exception, design/, media/, seo/]
    browser: disabled

  - id: vp-react-website
    request: Build a React website.
    stage: new
    expect: [engineering/frontend, design/frontend, testing/strategy]
    forbid: [testing/browser-exception, codebase/, media/]
    browser: disabled

  - id: vp-react-native-app
    request: Build a React Native application.
    stage: new
    expect: [design/frontend, engineering/frontend, testing/local-verification, testing/evidence]
    forbid: [testing/browser-exception, seo/, media/, codebase/]
    browser: disabled

  # ── Spec §70 end-to-end scenarios ─────────────────────────────────────────────────────────────────────────────
  - id: s70-a-new-saas
    request: Build me a travel booking SaaS with AI trip planning.
    stage: new
    expect: [engineering/planning, engineering/architecture, security baseline, design/design-direction, testing/strategy, engineering/completion]
    forbid: [codebase/, seo/, media/]
    change_type: NEW_FEATURE

  - id: s70-b-existing-maps
    request: Add Google Maps navigation to bookings.
    stage: existing
    expect: [engineering/implementation, codebase/impact-analysis, codebase/repository-understanding, engineering/security, testing/strategy, engineering/completion]
    forbid: [seo/, media/]
    change_type: NEW_FEATURE

  - id: s70-c-security-bug
    request: Fix the payment webhook security.
    stage: existing
    expect: [engineering/security, codebase/impact-analysis, testing/security, engineering/completion]
    forbid: [design/, media/, seo/]
    change_type: SECURITY_CHANGE

  - id: s70-d-design
    request: This landing page looks generic. Make it feel premium.
    stage: existing
    expect: [design/design-direction, design/visual-quality, design/typography, design/frontend, design/design-review]
    forbid: [seo/, engineering/, media/, codebase/]
    change_type: DESIGN_CHANGE

  - id: s70-e-seo-audit
    request: Audit my website.
    stage: unknown
    expect: [seo/auditing, native crawler, seo/evidence, seo/reporting]
    forbid: [engineering/, design/, media/, testing/]
    change_type: SEO_CHANGE

  - id: s70-f-seo-fix
    request: Audit my website and fix all technical SEO issues.
    stage: existing
    expect: [seo/auditing, seo/technical, seo/evidence, engineering/implementation, testing/local-verification]
    forbid: [media/, design/]
    pipeline: [seo, engineering, testing]
    change_type: SEO_CHANGE

  - id: s70-g-ai-search
    request: Make the website more visible in AI-generated answers.
    stage: unknown
    expect: [seo/aeo, seo/geo, seo/entity, seo/content, seo/evidence]
    forbid: [engineering/, media/, design/]
    change_type: SEO_CHANGE

  - id: s70-h-launch-video
    request: Make a launch video plan for our product.
    stage: existing
    expect: [media/launch-video]
    forbid: [engineering/, codebase/, seo/, testing/]
    change_type: MEDIA_CHANGE

  # ── Activation-mode guarantees (Ponytail explicit-only; refactor never implies simplicity review) ─────────────
  - id: simplicity-explicit
    request: Is this overengineered? Please simplify it.
    stage: existing
    expect: [engineering/simplicity]
    forbid: [seo/, design/, media/]

  - id: refactor-no-simplicity
    request: Refactor the billing module.
    stage: existing
    expect: [engineering/implementation, codebase/impact-analysis, testing/regression, engineering/completion]
    forbid: [engineering/simplicity, seo/, design/, media/]
    change_type: REFACTOR

  # ── Trial 2026-10-11 (docs/TRY_AGYLITE.md): wording must not swing the route ──────────────────────────────────────
  - id: trial-cli-build
    request: build a small Python command-line todo app with unit tests
    stage: new
    expect: [engineering/planning, engineering/architecture, engineering/implementation, testing/strategy, engineering/completion]
    forbid: [design/, engineering/security, seo/, media/, codebase/]
    change_type: NEW_FEATURE

  - id: trial-cli-description
    request: 'A small Python command-line todo app in this folder. Commands: add "<text>", list, done <id>. Todos saved to a local JSON file. Standard library only. Unit tests included.'
    stage: new
    expect: [engineering/planning, engineering/implementation, testing/strategy, engineering/completion]
    forbid: [design/, engineering/security, testing/release-verification, seo/, media/]
    change_type: NEW_FEATURE

  - id: trial-web-product
    request: create a web app dashboard for my team with user accounts
    stage: new
    expect: [engineering/planning, engineering/security, design/design-direction, engineering/completion]
    forbid: [seo/, media/, codebase/]
    change_type: NEW_FEATURE

  - id: trial-launch-video-new-project
    request: make a launch video for the todo app
    stage: new
    expect: [media/launch-video]
    forbid: [engineering/, design/, testing/, seo/]
    change_type: MEDIA_CHANGE

  # ── MP3 §1.4: Pocock-led stages ───────────────────────────────────────────────────────────────────────────────
  - id: mp3-grill-plan
    request: Grill me on this plan before I build it
    stage: unknown
    expect: [engineering/planning]
    forbid: [media/, testing/local-verification]

  - id: mp3-spec-tickets
    request: Turn what we discussed into a spec and tickets
    stage: unknown
    expect: [engineering/planning]

  - id: mp3-diagnose-flaky
    request: Diagnose why the checkout test is flaky
    stage: existing
    expect: [engineering/debugging]

  - id: mp3-deepening
    request: Find deepening opportunities in this codebase
    stage: existing
    expect: [engineering/architecture]

  # ── MP4 §2.5: inspiration URLs → design/inspiration-extract ────────────────────────────────────────────────────
  - id: mp4-extract-two
    request: Extract the design system from stripe.com and linear.app as inspiration
    stage: unknown
    expect: [design/inspiration-extract, design/design-system]
    forbid: [engineering/security, engineering/backend]

  - id: mp4-inspired-three
    request: Build our landing page inspired by vercel.com, raycast.com and linear.app
    stage: unknown
    expect: [design/inspiration-extract]

  - id: mp4-look-like
    request: Make our pricing page look like https://www.notion.so/pricing
    stage: existing
    expect: [design/inspiration-extract]
