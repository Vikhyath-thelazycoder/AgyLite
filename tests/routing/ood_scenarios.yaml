# Out-of-distribution routing scenarios (MP1 F13): requests no routing rule was written for. Same format as
# scenarios.yaml. `forbid` and `expect` must hold, except where marked `pending: <prompt>` (the expectation needs a
# capability or rule a later master prompt adds) or `pending_forbid: <prompt>` (the forbid needs a later domain to
# claim the request). Both markers are strict: an entry that already passes fails the test, so the marker is removed
# when the work lands. Comments record what the router did before MP1.
#
# Several phrasings come from Addy Osmani's agent-skills trigger evals (`evals/cases/*.json` → trigger.positive),
# MIT, addyosmani/agent-skills@aeac41d4d005999432bb7312f7ff06383a91d59d. They are marked `# addy: <skill>`.

