# engineering/completion — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Completion
description: Acceptance gates, evidence-backed completion states, no-placeholder output
intent_tags: [complete, don't stop, gates, definition of done]
origin: bundled
runtime_type: node
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
priority: 70
security_class: local-exec
cache_strategy: static
activation_conditions:
  when: ['task is substantial or multi-part, or the user requires completion gates']
verification_requirements: [every acceptance gate has evidence, completion state reported; no placeholders]
dependencies: []
related_capabilities: [testing/release-verification]
conflicts: []
fallback_capability: null
enabled: true
# MP1 F5: the primary source loads first (was alphabetical by upstream folder).
sources_priority: [files/unlazy/SKILL.md]
