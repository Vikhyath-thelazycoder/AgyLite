# Agylite — Agent Office layout (P23, D-043). Data, not code.
# Every capability in the registry has exactly one seat (tests enforce it). Coordinates are in the office's
# 480×300 pixel grid (docs/design/agent-office-mockup.html). `fixed` pins a state; `sources_any` lights a seat
# when any selected capability draws on that upstream (the Agency specialists sit across many capabilities).

version: 1
idle_after_minutes: 10        # an agent with no event for this long goes back to idle
sleep_after_minutes: 10       # the dashboard exits after this long without a page poll

rooms:
  - {id: front, name: Front desk, x: 8, y: 4, w: 464, h: 32}
  - {id: engineering, name: Engineering floor, x: 8, y: 40, w: 292, h: 110}
  - {id: design, name: Design studio, x: 308, y: 40, w: 164, h: 110}
  - {id: qa, name: QA lab, x: 8, y: 160, w: 150, h: 132}
  - {id: seomedia, name: SEO & Media, x: 166, y: 160, w: 166, h: 132}
  - {id: mentors, name: Mentors & watch, x: 340, y: 160, w: 132, h: 132}

