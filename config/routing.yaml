# Agylite — Routing configuration (v2, P8, spec §14–15, §54, D-012)
#
# The router is deterministic: request text, file paths and project facts are matched against the rules below and
# against each capability card's intent_tags (capabilities/**/card.yaml). BM25 over CARD.md runs only when nothing
# here is confident (spec §15 "semantic retrieval is fallback"). No LLM call happens inside the router.
#
# Signal strength:
#   strong — a rule below matched (keywords / regex / paths / project conditions). Survives suppression.
#   weak   — only a card intent_tag matched. Removed when a matched rule suppresses its domain or capability.
# Matching is case-insensitive on word boundaries; a keyword may be a phrase ("audit my website").

version: 2

# §54 change-request classes, checked in this order; the first class whose keywords match wins.
# `default_by_domain` applies when no keyword matches (by the top-scoring domain).
change_types:
  order:
    - {type: SECURITY_CHANGE, keywords: [security, secure, vulnerability, auth, authentication, authorization, csrf, xss, injection, secret, owasp, harden, hardening, permission]}
    - {type: SEO_CHANGE, keywords: [seo, rank, ranking, search console, sitemap, robots, ai search, aeo, geo, schema markup, backlinks, ai-generated answers, ai generated answers, answer engine]}
    - {type: MEDIA_CHANGE, keywords: [video, demo, deck, slides, presentation, launch post, showcase, screen recording]}
    - {type: OBSERVABILITY_CHANGE, keywords: [logging, logs, metrics, tracing, telemetry, monitoring, observability]}
    - {type: PERFORMANCE_CHANGE, keywords: [performance, slow, latency, faster, speed up, optimize, bundle size, memory leak]}
    - {type: BUG_FIX, keywords: [fix, bug, broken, crash, crashes, error, failing, fails, regression, not working, doesn't work]}
    - {type: TESTING_CHANGE, keywords: [test, tests, testing, coverage, tdd, e2e, check whether, verify, show me, screenshot]}
    - {type: REFACTOR, keywords: [refactor, restructure, reorganize, clean up, cleanup, simplify, modernize, rename]}
    - {type: DESIGN_CHANGE, keywords: [design, premium, look, looks, feel, redesign, layout, typography, font, color, spacing, visual, ui, ux, landing page, overlap, overlaps]}
    - {type: INFRA_CHANGE, keywords: [deploy, deployment, ci, docker, kubernetes, infrastructure, pipeline, hosting, terraform]}
    - {type: DOCUMENTATION_CHANGE, keywords: [document, docs, documentation, readme, adr, changelog]}
    - {type: PLAN_CHANGE, keywords: [plan, roadmap, phase, reprioritize, milestone, scope]}
    - {type: FEATURE_CHANGE, keywords: [change, update, modify, improve, adjust, tweak, extend, rework]}
    - {type: NEW_FEATURE, keywords: [add, build, create, implement, new, introduce, support, integrate, make]}
  # How the work is delivered is not what the work is: "build X with unit tests" is a feature, not a testing change.
  # These patterns are removed from the request before the change type is chosen (capability matching still sees them).
  ignore: ['\b(?:with|including|includes|plus|and)\s+(?:(?:unit|integration|automated)\s+)?tests?\b', '\b(?:(?:unit|integration|automated)\s+)?tests?\s+(?:included|too|as well)\b']
  default_by_domain:
    engineering: FEATURE_CHANGE
    codebase: FEATURE_CHANGE
    design: DESIGN_CHANGE
    testing: TESTING_CHANGE
    seo: SEO_CHANGE
    media: MEDIA_CHANGE
    observability: OBSERVABILITY_CHANGE
  fallback: FEATURE_CHANGE

# Guidance precedence (config/priorities.yaml conflict_hierarchy). The first matching pattern assigns the role; the
# router orders selected capabilities by (hierarchy level, -priority) and resolves declared conflicts with it.
roles:
  - {match: engineering/security, role: project-security}
  - {match: engineering/architecture, role: project-architecture}
  - {match: engineering/simplicity, role: simplicity}
  - {match: engineering/release, role: product-review}
  - {match: testing/release-verification, role: product-review}
  - {match: testing/*, role: security-testing}
  - {match: engineering/*, role: engineering-methodology}
  - {match: "*", role: domain-specialists}

limits:
  max_capabilities: 8            # selected (non-dependency) capabilities per request; lowest scores dropped first
  tag_min_score: 1               # weak-only capabilities need at least this score
  confident_score: 2             # below this total score, BM25 fallback runs
  bm25_top_k: 3                  # spec §47 "maximum semantic retrieval results"
  # MP1 F3: BM25 attached unrelated domains on generic overlap ("plan", "build", "video"). It now needs a score of
  # 4.0 and 75% of the best hit, may only add capabilities from the domains rules/tags already chose (or the top
  # hit's domain when nothing was chosen), must share two request words, and ignores request words that carry no domain signal.
  bm25_min_score: 4.0
  bm25_min_ratio: 0.75
  bm25_min_terms: 2              # one shared word ("video", "copy", "map") is coincidence, not a domain signal
  bm25_stopwords: [plan, build, make, create, write, project, product, app, thing, help, want, need, please, me, my, this, that]

# Project-stage behaviour (spec §19.2): existing projects get codebase understanding before change work; new
# projects never route to codebase capabilities.
project:
  existing_change_types: [NEW_FEATURE, FEATURE_CHANGE, BUG_FIX, REFACTOR, SECURITY_CHANGE, PERFORMANCE_CHANGE]
  existing_adds: [codebase/impact-analysis]
  new_forbids_domains: [codebase]

# Owner decision 2026-10-21 (MP3 §3.1): Unlazy's completion gate runs on every multi-step change. Added as a dependency
# (it does not count toward max_capabilities), only for routed (not unmatched) requests. Design, SEO, media, plan,
# docs and testing changes are not code-changing types here; MIGRATION_CHANGE is not a change type in this taxonomy.
change_type_adds:
  types: [NEW_FEATURE, FEATURE_CHANGE, BUG_FIX, REFACTOR, SECURITY_CHANGE, PERFORMANCE_CHANGE]
  add: [engineering/completion]

rules:
  # ── Product / new project ─────────────────────────────────────────────────────────────────────────────────────
  - id: new-product
    description: Build a new application, tool or SaaS (spec §14, §19.3, scenario A). Design and security join only
      when the product has an interface or users/network exposure (the two rules below), so a CLI or library stays lean.
    any: &new_product [saas, new app, new application, from scratch, new project, mvp, greenfield, build me, build a, build an]
    # A request that is just the product description ("a small Python CLI todo app …", "create an API for …").
    regex: &new_product_rx ['^(?:task:\s*)?(?:(?:please\s+)?(?:build|create|make|write|develop|implement|scaffold|start)\s+)?(?:me\s+)?(?:a|an)\s+(?:[\w-]+\s+){0,6}?(?:app|application|cli|tool|program|script|service|api|bot|game|library|website|web app|dashboard)\b']
    unless: &new_product_unless [build a test, build a component, build fails, build failing, build error, video, launch video, promo video, deck, slides, presentation, seo, audit]
    project: [new, unknown]
    select: [engineering/planning, engineering/architecture, engineering/implementation, testing/strategy]
    weight: 3

  - id: new-product-ui
    description: A new product with a user interface also gets a design direction
    any: *new_product
    regex: *new_product_rx
    require_any: [saas, web, website, web app, webapp, frontend, front-end, ui, ux, dashboard, landing page, mobile, ios, android, page, pages, screen, screens, interface, portal, storefront, marketplace]
    unless: *new_product_unless
    project: [new, unknown]
    select: [design/design-direction]
    weight: 3

  - id: new-product-exposed
    description: A new product with users, accounts, payments or network exposure also gets the security baseline
    any: *new_product
    regex: *new_product_rx
    require_any: [saas, web, website, web app, webapp, api, server, backend, users, user accounts, account, accounts, login, log in, sign in, signup, sign up, auth, authentication, payment, payments, checkout, multi-tenant, cloud, online, marketplace, booking, bookings, mobile, admin]
    unless: *new_product_unless
    project: [new, unknown]
    select: [engineering/security]
    weight: 3

  - id: existing-feature
    description: Feature work on an existing project (spec §19.4, scenario B)
    any: [add, extend, integrate, support, introduce]
    project: [existing]
    select: [engineering/implementation, codebase/impact-analysis, testing/strategy]
    weight: 2

  - id: third-party-integration
    description: External APIs, keys and payments carry backend and security work
    any: [google maps, maps api, map view, map widget, mapbox, leaflet, geocoding, geolocation, stripe, paypal, razorpay, payment, payments, checkout, oauth, api key, third-party, third party, twilio, sendgrid, webhook, webhooks]
    select: [engineering/backend, engineering/security]
    weight: 2

  # Spec (verification policy §18): a webhook change is verified by unit, signature, integration, negative-path,
  # idempotency and security tests + typecheck/build — never by browser QA.
  - id: webhook-verification
    description: Payment/webhook changes select local verification and security tests
    any: [webhook, webhooks, payment webhook, payment webhooks]
    select: [testing/local-verification, testing/security]
    weight: 2

  # ── Security (scenario C, spec §14 "Improve checkout security") ───────────────────────────────────────────────
  - id: security-change
    description: Security fixes and hardening
    any: [security, secure, vulnerability, vulnerable, harden, hardening, csrf, xss, sql injection, injection, owasp, webhook verification, signature verification, auth bypass]
    select: [engineering/security, codebase/impact-analysis, testing/security]
    suppress: [design, media, seo, testing/local-verification]
    weight: 4

  # ── Design (scenario D, spec §14) ─────────────────────────────────────────────────────────────────────────────
  - id: design-premium
    description: Make an interface feel premium / less generic
    any: [premium, generic, high-end, polished, ai slop, slop, bland, make it pop, redesign]
    select: [design/design-direction, design/visual-quality, design/typography, design/frontend, design/design-review]
    suppress: [seo, media, engineering, testing]
    weight: 3

  - id: layout-check
    description: Responsive / layout verification (spec §23A.14 "mobile header overlaps the hero")
    any: [overlap, overlaps, overlapping, responsive, breakpoint, viewport, mobile layout, cut off, misaligned]
    select: [design/visual-quality, design/frontend, testing/local-verification]
    suppress: [seo, media, engineering]
    weight: 3

  # ── Native mobile (D-034: Appllama native rules merged into design/frontend + design/motion) ──────────────────
  - id: mobile-native
    description: React Native / Expo / native mobile app work (native fidelity, navigation semantics); no simulator loop
    any: [react native, react-native, expo, expo router, ios app, android app, mobile app, native app, swiftui]
    select: [design/frontend, engineering/frontend, testing/local-verification]
    suppress: [seo, media]
    weight: 3

  # ── Verification: local test-first (D-035, config/verification.yaml) ─────────────────────────────────────────
  - id: flow-check
    description: Check that a user flow works with deterministic local tests (no browser)
    any: [check whether, check that, check if, verify, does it work, still work, works]
    require_any: [flow, login, log in, sign in, signup, sign up, checkout, logout, form, page, endpoint, api]
    select: [testing/local-verification]
    weight: 3

  - id: auth-flow
    description: Login / session flows need security testing
    any: [login, log in, sign in, signup, sign up, logout, session, password reset]
    select: [testing/security]
    weight: 2

  # An explicit request to see the site never starts an agent browser: local verification runs, and the request is
  # surfaced as `browser: exception-requested` (recorded per project; the user operates any browser, D-035).
  - id: explicit-visual
    description: The user explicitly asks to see the site → local verification + logged browser-exception request
    regex: ['\b(open|show me|screenshot|take a screenshot of|look at)\b.*\b(site|website|page|app)\b', '\bwhat (it|the (site|website|page|app)) looks like\b']
    select: [testing/local-verification]
    browser_exception: true
    suppress: [engineering, seo, media, design]
    weight: 4

  # ── SEO (scenarios E, F, G; spec §14) ─────────────────────────────────────────────────────────────────────────
  - id: seo-audit
    description: Audit a website's SEO (native runtime via dependencies, no browser by default)
    any: [seo audit, audit my website, audit my site, audit the site, audit the website, website audit, site audit, technical seo, why not ranking, rank better]
    regex: ['\baudit\b.*\bseo\b', '\bseo\b.*\baudit\b']
    select: [seo/auditing, seo/technical, seo/content, seo/reporting]
    suppress: [engineering, design, media, testing]
    weight: 4

  - id: ai-search
    description: Visibility in AI-generated answers (AEO/GEO)
    any: [ai search, ai-generated answers, ai generated answers, ai answers, answer engine, answer engines, generative engine, llm visibility, chatgpt, perplexity, ai overview, ai overviews, aeo, geo seo]
    select: [seo/ai-search, seo/entity, seo/content]
    suppress: [engineering, media, design]
    weight: 4

  - id: seo-fix
    description: Audit then fix SEO findings → engineering and testing follow the audit (scenario F)
    any: [fix, implement, resolve, repair, correct]
    require_any: [seo, sitemap, robots, canonical, indexing, meta tags, structured data]
    select: [seo/auditing, seo/technical, engineering/implementation, testing/local-verification]
    pipeline: [seo, engineering, testing]
    weight: 4

  # ── Media (scenario H) ────────────────────────────────────────────────────────────────────────────────────────
  - id: media
    description: Launch video, demo or showcase material; never backend/database work
    any: [launch video, promo video, product video, video plan, explainer video, demo video, walkthrough video, launch post, product launch]
    select: [media/launch-video]
    suppress: [engineering, codebase, testing, seo]
    weight: 4

  # ── Engineering specifics ─────────────────────────────────────────────────────────────────────────────────────
  - id: debugging
    description: Something is broken
    any: [bug, broken, crash, crashes, error, failing, fails, exception, stack trace, not working, doesn't work]
    select: [engineering/debugging, testing/regression]
    weight: 2

  - id: architecture
    description: Architecture and system design
    any: [architecture, system design, design the system, service boundaries, adr, trd]
    select: [engineering/architecture]
    suppress: [design]
    weight: 3

  - id: codebase-understanding
    description: Unfamiliar or large codebase
    any: [unfamiliar, monorepo, large codebase, understand the code, understand this codebase, onboard, navigate the architecture, trace dependencies]
    select: [codebase/repository-understanding, codebase/code-search]
    weight: 3

  - id: refactor
    description: Behaviour-preserving restructuring (simplicity stays explicit-only)
    any: [refactor, restructure, reorganize, clean up, cleanup, modernize]
    select: [engineering/implementation, codebase/impact-analysis, testing/regression]
    weight: 2

  - id: simplicity-review
    description: Explicit simplicity / over-engineering review (Ponytail-derived; never implied by refactor)
    any: [overengineered, over-engineered, overengineering, yagni, simplicity review, too complex, unnecessary abstraction, ponytail, simplify]
    select: [engineering/simplicity]
    explicit: true
    weight: 3

  - id: release
    description: Shipping and release readiness
    any: [release, ship it, ship this, deploy to production, go live, launch to production, cut a release]
    select: [engineering/release, testing/release-verification]
    weight: 3

  - id: large-feature
    description: Substantial multi-part work needs completion discipline
    any: [large feature, multi-file, substantial, don't stop, do not stop, until done, complete implementation, end to end, end-to-end]
    select: [engineering/completion]
    weight: 2

  # ── MP3 §1.4: Pocock-led stages (owner decision 2026-10-21) ───────────────────────────────────────────────────
  - id: requirements-grilling
    description: Requirements interview before building (Pocock grilling)
    any: [grill me, grill this, grilling, stress-test my plan, stress test my plan, poke holes, interview me, challenge my plan, sharpen this plan]
    select: [engineering/planning]
    suppress: [media, seo, design]
    weight: 4

  - id: spec-tickets
    description: Spec synthesis and tracer-bullet tickets (Pocock to-spec / to-tickets)
    any: [write a spec, turn this into a spec, to spec, into a spec, break this into tickets, tracer bullet, tracer-bullet, vertical slices, split into tasks]
    select: [engineering/planning]
    weight: 3

  - id: diagnose
    description: Diagnosis loop for hard bugs, flakes and regressions (Pocock diagnosing-bugs)
    any: [diagnose, root cause, why does this fail, why is this failing, flaky, regression appeared, bisect]
    select: [engineering/debugging, testing/regression]
    weight: 3

  - id: architecture-deepening
    description: Deep-module architecture review (Pocock improve-codebase-architecture)
    any: [deep module, deepen, deepening, shallow module, improve the architecture, architecture review, refactor the architecture, module boundaries]
    select: [engineering/architecture, codebase/impact-analysis]
    weight: 3

# File-path signals (spec §15 "file paths"): a changed path matching a glob selects capabilities (strong).
paths:
  - {glob: ["**/auth/**", "**/*auth*.*", "**/security/**", "**/middleware/**"], select: [engineering/security]}
  - {glob: ["**/*.css", "**/*.scss", "**/tailwind.config.*", "**/styles/**"], select: [design/frontend]}
  - {glob: ["**/*.test.*", "**/*_test.*", "**/test_*.py", "**/tests/**", "**/__tests__/**"], select: [testing/strategy]}
  - {glob: ["**/migrations/**", "**/*.sql", "**/schema.prisma"], select: [engineering/migration, engineering/backend]}
  - {glob: ["**/api/**", "**/routes/**", "**/server/**", "**/*controller*.*"], select: [engineering/backend]}
  - {glob: ["**/components/**", "**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte"], select: [engineering/frontend]}
  - {glob: ["**/robots.txt", "**/sitemap*.xml"], select: [seo/technical]}
  - {glob: [".github/workflows/**", "**/Dockerfile", "**/docker-compose*.yml"], select: [engineering/release]}
