# engineering/spec-review — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
# Step 4b (doc 24 §4): EGM's review of a spec, plan or design doc before code, then the resolve pass.
# Owner 2026-11-20 (Step 5 spec-review cost, $4.88 vs $0.24 with no skill): GUIDE.md runs EGM's eight lenses in one
# pass with no subagents; the full EGM flow (about 9 Opus subagents) only when the user asks for it by name.
name: Spec review
