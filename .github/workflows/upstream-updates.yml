# Agylite upstream tracking (P28, D-047; MP6 review-and-approve, owner decision 2026-10-21).
# Daily: report which upstreams have new commits (no changes).
# Weekly (Monday) and monthly (1st): `agylite update --review` classifies every new commit, diffs what agents read,
# builds and checks a candidate and runs Tier 0 on it. Only ADOPT / SECURITY_FAST_TRACK upstreams are approved, and only
# inside this runner's throwaway home, to produce the pins of ONE pull request labelled needs-owner-approval (never
# auto-merged). Merging that PR is the owner's approval for everyone who installs the plugin. Tier 1 never runs here.
name: Upstream updates

on:
  schedule:
    - cron: "17 6 * * *"     # daily check
    - cron: "37 6 * * 1"     # weekly apply (weekly-tracked upstreams)
    - cron: "57 6 1 * *"     # monthly apply (all non-manual upstreams)
  workflow_dispatch:
    inputs:
      mode: {description: "check or apply", default: apply, type: choice, options: [check, apply]}

permissions:
  contents: write
  pull-requests: write

jobs:
  upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # MP1 F14: `runner` is not available in job-level env; GitHub rejected the whole file (0 jobs, never scheduled).
      - name: Engine home
        run: echo "AGYLITE_HOME=$RUNNER_TEMP/agylite" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install Agylite
        run: pip install -e .

      - name: Check for new upstream commits
        run: |
          agylite update --check | tee check.txt
          { echo '## Upstream check'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to apply
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"; track="";
          elif [ "${{ github.event.schedule }}" = "37 6 * * 1" ]; then mode=apply; track="--track weekly";
          elif [ "${{ github.event.schedule }}" = "57 6 1 * *" ]; then mode=apply; track="--track weekly --track monthly";
          else mode=check; track=""; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "track=$track" >> "$GITHUB_OUTPUT"

      - name: Build the current bundle
        if: steps.mode.outputs.mode == 'apply'
        run: |
          agylite bundle fetch --staging "$AGYLITE_HOME/staging/upstream"
          agylite bundle build --staging "$AGYLITE_HOME/staging/upstream" --self-test

      - name: Review new commits (never activates)
        if: steps.mode.outputs.mode == 'apply'
        run: |
          agylite update --review --due ${{ steps.mode.outputs.track }} --tier1-plan --out review | tee review.txt

      - name: Approve ADOPT / SECURITY_FAST_TRACK in this throwaway home (one upstream at a time)
        if: steps.mode.outputs.mode == 'apply'
        run: |
          # each candidate is built against the other upstreams' current pins, so approving one makes the others stale:
          # re-review each adoptable upstream right before approving it
          for repo in $(python -c "import json; print(' '.join(r['repo'] for r in json.load(open('review/report.json'))['upstreams'] if r.get('verdict') in ('ADOPT', 'SECURITY_FAST_TRACK')))"); do
            agylite update --review --repo "$repo" --out "review/approve-$repo" | tee -a review.txt
            if python -c "import json,sys; r=json.load(open('review/approve-$repo/report.json'))['upstreams'][0]; sys.exit(r.get('verdict') not in ('ADOPT', 'SECURITY_FAST_TRACK'))"; then
              agylite update --approve "$repo" --review "review/approve-$repo" | tee -a review.txt
            fi
          done
          agylite update --promote | tee -a review.txt

      - name: Regenerate audited evidence, notices and docs
        if: steps.mode.outputs.mode == 'apply'
        run: |
          agylite bundle fetch --staging .staging/upstream
          python tools/audit/extraction_matrix.py
          python tools/audit/render_matrix_docs.py
          python -m agylite.bundle.notices
          agylite registry cards
          agylite bundle build --staging .staging/upstream --no-activate

      - name: Tests, diagnostics and benchmarks
        if: steps.mode.outputs.mode == 'apply'
        run: |
          python -m unittest discover -s tests
          agylite validate --no-unittest
          agylite benchmark --compare --out docs/benchmarks/RESULTS.md --plugins-root /nonexistent > /dev/null

      - name: Pull request body
        if: steps.mode.outputs.mode == 'apply'
        run: |
          { echo '> **Owner approval:** merging this pull request approves these upstream pins for everyone who installs'
            echo '> the plugin. Nothing here auto-merges. NEEDS_RULES, HOLD and ADOPT_AFTER_TIER1 upstreams are listed'
            echo '> below but stay out of the pins; their proposed-rules patches are attached to the workflow run.'
            echo; cat review/REPORT.md; } > pr-body.md

      - name: Keep the review (report, diffs, proposed-rules patches)
        if: steps.mode.outputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-review
          path: review/

      - name: Open a pull request
        if: steps.mode.outputs.mode == 'apply'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-updates
          title: "Upstream updates (needs owner approval)"
          labels: needs-owner-approval
          commit-message: "chore(upstreams): reviewed upstream pins (agylite update --review, ADOPT / SECURITY_FAST_TRACK only)"
          body-path: pr-body.md
          add-paths: |
            docs/audit/evidence/**
            docs/audit/05_CAPABILITY_MATRIX.md
            docs/audit/06_DOMAIN_MAPPING.md
            THIRD_PARTY_NOTICES.md
            third_party/licenses.json
            capabilities/**/CARD.md
            docs/benchmarks/RESULTS.md
