# Agylite — engineering lifecycle (P13, spec §19, §25, D-038)
#
# One lifecycle for all engineering work: UNDERSTAND → PLAN → IMPLEMENT → TEST → VERIFY → RECONCILE. Replaces the
# v1 workflows/*.md. `agylite route` returns the steps for the request's change type and project stage; each step
# names the OS command that performs it and the exit criterion that must hold before the next step starts.
# Completion states are spec §25 (agylite/project/lifecycle.py enforces the transitions): a task is VERIFIED or
# COMPLETED only with recorded evidence, never on a confident report.

version: 1

steps:
  UNDERSTAND:
    purpose: Know what is asked and what it touches before changing anything.
    commands:
      existing: ['agylite plan locate "<request>"', "agylite codebase affected --paths <files>"]
      new: ['agylite project questions "<request>"', 'agylite project answer <id> "<answer>"']
    exit: Intent restated; affected files and their tests listed (existing) or every BLOCKING requirement question answered and recorded (new; a task cannot start while one is open).
  INSPIRATION:
    # MP4 §3.2: only for DESIGN_CHANGE routes with design/inspiration-extract (agylite/project/lifecycle.py steps_for).
    purpose: Turn the inspiration sites into one DESIGN.md the owner approves before any UI code.
    commands:
      any: ["agylite design extract <url> [<url> [<url>]]", 'agylite project questions "<request>"',
            'agylite project answer design-md-approved "<who approved, when>"',
            'agylite decide add --kind design --topic DESIGN.md --decision "DESIGN.md approved" --reason "<who, when>"']
    exit: DESIGN.md written (systems, never identity) and approved by the owner; the approval is answered (design-md-approved) and recorded as a design decision.
  PLAN:
    purpose: Put the change in the one living plan with acceptance criteria.
    commands:
      existing: ['agylite plan reconcile "<request>"']
      new: ['agylite plan add-task <phase> "<title>" --acceptance "<criteria>"']
    exit: Task exists in the right phase with acceptance criteria; architecture changes recorded with `agylite decide add`.
  IMPLEMENT:
    purpose: Make the change within the planned scope.
    commands:
      any: ["agylite plan set-status <task> IN_PROGRESS"]
    exit: Complete deliverable, no placeholders or deferred remainder; scope matches the plan task.
  TEST:
    purpose: Prove the behaviour with tests that would fail without the change.
    commands:
      any: ["agylite verify --plan"]
    exit: Every changed behaviour has a test; new tests fail before and pass after the change.
  VERIFY:
    purpose: Run the local checks and record evidence (config/verification.yaml, local test-first).
    commands:
      any: ["agylite verify", "agylite plan set-status <task> READY_FOR_VERIFICATION"]
    exit: All selected checks PASSED with command, exit code and counts recorded; nothing visual claimed as verified.
  RECONCILE:
    purpose: Close the loop in the plan and state.
    commands:
      any: ["agylite plan set-status <task> VERIFIED --evidence <evidence file>", "agylite used"]
    exit: Task VERIFIED (or COMPLETED) with evidence; follow-ups added as PLANNED tasks, never silently dropped; the final answer ends with the `agylite used` report (capabilities, upstream projects, engines).

# Per change type: the step order and the extra rule that step carries. Types not listed use `default`.
change_types:
  default: {steps: [UNDERSTAND, PLAN, IMPLEMENT, TEST, VERIFY, RECONCILE]}
  BUG_FIX:
    steps: [UNDERSTAND, TEST, IMPLEMENT, VERIFY, RECONCILE]
    rules: {TEST: "Reproduce the bug as a failing regression test before changing code."}
  REFACTOR:
    steps: [UNDERSTAND, VERIFY, IMPLEMENT, VERIFY, RECONCILE]
    rules: {VERIFY: "Tests are green before and after; behaviour and public interfaces are unchanged."}
  SECURITY_CHANGE:
    steps: [UNDERSTAND, PLAN, IMPLEMENT, TEST, VERIFY, RECONCILE]
    rules: {TEST: "Include negative tests (rejected signatures, unauthorised access, injection inputs)."}
  DOCUMENTATION_CHANGE: {steps: [UNDERSTAND, IMPLEMENT, RECONCILE]}
  PLAN_CHANGE: {steps: [UNDERSTAND, PLAN, RECONCILE]}

# Completion discipline (Unlazy-derived, engineering/completion): substantial work writes acceptance gates first.
completion:
  substantial_when: [multi-file change, new phase, more than one deliverable, user asks for exhaustive completion]
  gates: ["agylite gates lint GATES.md", "agylite gates check GATES.md"]
  done_requires: [evidence recorded, every gate met or visibly abandoned with a reason]
