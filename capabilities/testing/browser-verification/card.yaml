# testing/browser-verification — capability card (spec §13). Provenance fields (sources, commit, license, size) are
# generated by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
# D-049 (IMPLEMENTATION_PLAN §2.2, supersedes D-035's browser-exception): UI work is done when the tests pass AND
# `agylite verify --browser` passes. Addy's devtools skill (CLI + Playwright, its untrusted-content rules verbatim) leads.
name: Browser verification
description: Browser check of UI work — screenshots at 1440/768/390, console, network, overflow and flows, next to the tests
intent_tags: [browser check, check in the browser, screenshots, console errors, responsive check, click path]
origin: mixed
runtime_type: node
requires_network: optional
requires_browser: required-for-output
requires_codebase_analysis: false
context_level: L2
security_class: local-exec
cache_strategy: run
activation_conditions:
  mode: on-demand
  when: [UI or website work needs its browser check, or the user asks to see the site]
verification_requirements: [agylite verify --browser PASSED with screenshots at 1440/768/390 and report.json hashes, the project's tests pass too]
dependencies: [testing/local-verification]
related_capabilities: [testing/browser-qa, design/visual-quality]
conflicts: []
fallback_capability: null
web_qa_class: CORE
web_qa_modes: {headless: CORE, screenshot: CORE, chrome_devtools: OPTIONAL, visible: OPTIONAL}
sources_priority: [files/addy/skills/browser-testing-with-devtools/SKILL.md, files/ecc/skills/click-path-audit/SKILL.md]
enabled: true
