[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agylite"
dynamic = ["version"]
description = "Agylite — one local-first core with thin host adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Vikhyath", email = "vikhyathmgowda007@gmail.com"}]
dependencies = ["PyYAML>=6"]

[project.urls]
Repository = "https://github.com/Vikhyath-thelazycoder/AgyLite"

[project.scripts]
agylite = "agylite.cli:main"
vikhyath = "agylite.cli:main"   # pre-rename alias (D-044)

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["agylite*"]

[tool.setuptools.package-data]
agylite = ["dashboard/static/*", "dashboard/demo_events.json"]
