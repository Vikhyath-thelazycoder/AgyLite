# youtube/repurpose — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
# MP5 §2.3: yt-shorts, yt-edit, yt-chapters from youtube-agent-skill (agylite youtube deadair, chapters).
name: Repurpose
description: Shorts picks, an edit decision list and chapters from a transcript; never cuts or renders video
intent_tags: [youtube shorts, short-form video, vertical clips, video chapters, youtube chapters, dead air, edit decision list]
origin: bundled
runtime_type: python-stdlib
requires_network: optional
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: static
activation_conditions:
  when: [the request asks to clip, shorten, chapter or repurpose a video]
verification_requirements: [picks, cuts and chapters carry timecodes from the transcript, no media touched]
dependencies: [research/video]
related_capabilities: [youtube/script]
conflicts: []
fallback_capability: null
sources_priority: [files/ytagent/skills/yt-shorts/SKILL.md, files/ytagent/skills/yt-edit/SKILL.md, files/ytagent/skills/yt-chapters/SKILL.md]
enabled: true
