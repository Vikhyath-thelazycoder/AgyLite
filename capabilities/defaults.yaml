# Registry-wide defaults (spec §13). Merged into every card by agylite/registry/loader.py; a card may override.
# Domain-level routing defaults (priority, activation mode) live in config/priorities.yaml.

version: 1

# Registry and display order of the domains; each has capabilities/<domain>/domain.yaml.
domains: [engineering, codebase, design, testing, research, youtube, seo, media, observability]

# Capabilities are host-neutral: every host reaches them through its thin adapter calling the `agylite` CLI (D-009).
# Status stays NOT_VERIFIED until the host's adapter phase (P19–P22) records runtime evidence (D-024).
host_compatibility:
  claude-code: {integration: adapter, status: NOT_VERIFIED}
  codex: {integration: adapter, status: NOT_VERIFIED}
  cursor: {integration: adapter, status: NOT_VERIFIED}
  antigravity: {integration: adapter, status: NOT_VERIFIED}
