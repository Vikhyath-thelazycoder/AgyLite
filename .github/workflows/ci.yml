name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint workflow files
        # MP1 F14: an invalid workflow (e.g. `runner` in job-level env) is rejected by GitHub silently, with 0 jobs.
        run: |
          pip install actionlint-py==1.7.12.25
          actionlint .github/workflows/*.yml

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Doctor diagnostics
        run: |
          chmod +x scripts/doctor
          ./scripts/doctor

      - name: Run Validation suite
        run: |
          chmod +x scripts/validate
          ./scripts/validate

      - name: Check capability registry
        run: |
          agylite registry check --no-bundle

      - name: Check generated host packaging is current
        run: |
          agylite adapters render --check

      - name: Run Benchmark analysis
        run: |
          chmod +x scripts/benchmark
          ./scripts/benchmark

      - name: Verify Strict NO MCP
        run: |
          if [ -f .mcp.json ]; then
            echo "ERROR: .mcp.json found — MCP is strictly prohibited"
            exit 1
          fi
          if grep -rq "mcpServers" .codex-plugin/ .claude-plugin/ plugin.json; then
            echo "ERROR: mcpServers found in plugin manifests"
            exit 1
          fi
          echo "✅ Strict NO MCP confirmed"

      - name: Verify NO Vendor Copies
        run: |
          if [ -d vendor ]; then
            echo "ERROR: vendor/ directory found"
            exit 1
          fi
          echo "✅ No vendor copies confirmed"

  # D-049 (IMPLEMENTATION_PLAN §4.1): the browser check must FAIL the broken fixture site and PASS the fixed one.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Engine home
        run: echo "AGYLITE_HOME=$RUNNER_TEMP/agylite" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install Agylite and the browser runtime
        run: |
          pip install -e .
          agylite runtime install browser
          (cd "$AGYLITE_HOME/runtimes/browser-"*/ && PLAYWRIGHT_BROWSERS_PATH="$PWD/browsers" npx playwright install-deps chromium)
      - name: Browser fixture tests
        run: python -m unittest tests.browser.test_browser -v
