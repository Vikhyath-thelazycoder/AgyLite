# testing/release-verification — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Release verification
description: Re-verify gates and evidence before claiming completion
intent_tags: [verify complete, ready to ship, is it done, definition of done]
origin: bundled
runtime_type: node
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
priority: 70
security_class: local-exec
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [every gate re-verified on the final state]
dependencies: [engineering/completion]
related_capabilities: [engineering/completion]
conflicts: []
fallback_capability: null
web_qa_class: CORE
enabled: true
