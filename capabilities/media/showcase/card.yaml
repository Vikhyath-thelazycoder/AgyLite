# media/showcase — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Showcase
description: Launch copy and storytelling
intent_tags: [launch post, showcase, marketing copy, launch copy, copywriting, announcement]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [every claim in the copy is true of the product]
dependencies: []
related_capabilities: [media/launch-video]
conflicts: []
fallback_capability: null
enabled: true
