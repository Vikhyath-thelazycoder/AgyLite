# testing/browser-qa — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
# D-049 + owner decision 2026-10-22: gstack /qa + browse, full, as gstack ships it (installed by
# `agylite runtime install gstack`: telemetry off, optional global hooks skipped). Its skill runs from that install.
name: Browser QA
description: gstack /qa — explore a site in a real browser, find and fix defects, re-verify; when the request says QA or click through
intent_tags: [qa the site, qa this, test the site, click through, exploratory qa, find bugs on the site]
origin: os-native
guide: GUIDE.md
runtime_type: os-native
requires_network: optional
requires_browser: required-for-output
requires_codebase_analysis: false
context_level: L2
security_class: local-exec
cache_strategy: run
activation_conditions:
  mode: on-demand
  when: ['the request says QA, test the site or click through']
verification_requirements: [gstack /qa report with each defect found, fixed and re-verified, the project's tests pass too]
dependencies: [testing/browser-verification]
related_capabilities: [testing/local-verification]
conflicts: []
fallback_capability: null
web_qa_class: CORE
web_qa_modes: {headless: CORE, screenshot: CORE, visible: OPTIONAL}
enabled: true
