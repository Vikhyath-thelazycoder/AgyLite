# engineering/review — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Review
description: Multi-axis code review, pre-landing review, specialist reviewers
intent_tags: [review, code review, pr, diff]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: true
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['findings ranked by severity with file:line evidence']
dependencies: []
related_capabilities: [engineering/security, engineering/simplicity]
conflicts: []
fallback_capability: null
enabled: true
# MP1 F5: the primary source loads first (was alphabetical by upstream folder).
sources_priority: [files/gstack/review/SKILL.md, files/addy/skills/code-review-and-quality/SKILL.md]
