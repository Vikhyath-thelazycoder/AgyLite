# Agylite — Priority Configuration
# Conflict resolution and domain-level defaults. Per-capability metadata lives in capabilities/**/card.yaml.

# When two capabilities provide conflicting guidance, use this hierarchy (level 1 wins)
conflict_hierarchy:
  - level: 1
    source: user-requirements
    description: "Explicit user requirements always win"

  - level: 2
    source: project-security
    description: "Security and safety constraints"

  - level: 3
    source: project-architecture
    description: "Established project architecture decisions"

  - level: 4
    source: engineering-methodology
    description: "Engineering workflow methodology (planning, implementation, testing, verification)"

  - level: 5
    source: security-testing
    description: "Specialized security and testing guidance"

  - level: 6
    source: domain-specialists
    description: "Domain specialist perspectives"

  - level: 7
    source: product-review
    description: "Product and release review workflows"

  - level: 8
    source: simplicity
    description: "Simplicity optimization (explicit request only)"

# Domain-level defaults. A card's `priority` (1–100, higher wins ties within a hierarchy level) and
# `activation_conditions.mode` fall back to these when the card does not set them.
# Activation modes: on-demand (routed by intent) · explicit (only on explicit user request) ·
# stack-detected (selected by project stack) · internal (used by the OS or other capabilities, never routed directly) ·
# fallback (only when deterministic capabilities cannot decide).
domain_defaults:
  engineering: {priority: 50, activation: on-demand}
  codebase: {priority: 50, activation: on-demand}
  design: {priority: 50, activation: on-demand}
  testing: {priority: 50, activation: on-demand}
  research: {priority: 50, activation: on-demand}
  youtube: {priority: 50, activation: on-demand}
  seo: {priority: 50, activation: on-demand}
  media: {priority: 50, activation: on-demand}
  observability: {priority: 50, activation: internal}
